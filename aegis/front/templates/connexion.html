{% extends "base.html" %}
{% block content %}
<div class="nfc-login">
    <h2>🔐 Connexion Badge NFC</h2>
    <p style="font-size: 24px; margin: 40px 0;">Testez vos badges :</p>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin: 40px 0;">
        <div>
            <button class="primary" onclick="testBadge('badge_admin_123')" style="height: 120px; font-size: 22px;">
                👑 Admin (badge_admin_123)
            </button>
        </div>
        <div>
            <button class="primary" onclick="testBadge('badge_user_456')" style="height: 120px; font-size: 22px;">
                👤 User 1 (badge_user_456)
            </button>
        </div>
        <div>
            <button class="primary" onclick="testBadge('badge_user_789')" style="height: 120px; font-size: 22px;">
                👤 User 2 (badge_user_789)
            </button>
        </div>
    </div>
</div>
<script>
function testBadge(uid) {
    document.querySelector('form').innerHTML = 
        `<input type="hidden" name="badge_uid" value="${uid}">
         <button type="submit" class="primary" style="font-size: 24px; padding: 30px; height: 100px;">
            ✅ Connexion avec ${uid}
         </button>`;
    document.querySelector('form').submit();
}
</script>
<form method="POST"></form>
{% endblock %}
