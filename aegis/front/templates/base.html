<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AEGIS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:   #0d1b2a;
            --deep:   #1b2d42;
            --accent: #e63946;
            --gold:   #f4a261;
            --cyan:   #4cc9f0;
            --text:   #e8edf3;
            --muted:  #7a8ca0;
            --surface:#162032;
            --border: rgba(255,255,255,0.08);
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--deep);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-logo {
            padding: 32px 28px 24px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            color: white;
        }
        .sidebar-logo h1 span { color: var(--accent); }
        .sidebar-logo p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .user-card {
            margin: 20px 16px;
            padding: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .user-card .name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 15px;
        }
        .user-card .username {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }
        .role-pill {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .role-superadmin, .role-super_admin { background: var(--accent); color: white; }
        .role-admin      { background: var(--gold); color: #1a0000; }
        .role-manager, .role-responsable   { background: #2ecc71; color: #001a08; }
        .role-user, .role-member  { background: var(--cyan); color: #001a2a; }
        .role-auditor    { background: #9b59b6; color: white; }

        nav ul { list-style: none; padding: 12px 0; flex: 1; }
        .nav-section {
            padding: 16px 24px 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 24px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.15s;
        }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.05); border-left-color: var(--accent); }
        .nav-link.active { color: white; background: rgba(230,57,70,0.12); border-left-color: var(--accent); }
        .nav-icon { font-size: 16px; width: 20px; text-align: center; }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }
        .btn-logout {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            background: rgba(230,57,70,0.1);
            border: 1px solid rgba(230,57,70,0.25);
            border-radius: var(--radius);
            color: var(--accent);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .btn-logout:hover { background: rgba(230,57,70,0.2); }

        /* ── Main ── */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 48px;
            background: var(--navy);
        }

        /* ── Components ── */
        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .page-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 36px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
        }
        .card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .stat-card.accent::before { background: var(--accent); }
        .stat-card.cyan::before   { background: var(--cyan); }
        .stat-card.gold::before   { background: var(--gold); }
        .stat-number {
            font-family: 'Syne', sans-serif;
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
        }
        .stat-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        tr:hover td { background: rgba(255,255,255,0.03); }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: border-color 0.15s;
            margin-bottom: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--cyan);
        }
        select option { background: var(--deep); }
        label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #c1121f; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
        .btn-secondary:hover { background: rgba(255,255,255,0.14); }
        .btn-danger { background: rgba(230,57,70,0.15); color: var(--accent); border: 1px solid rgba(230,57,70,0.3); }
        .btn-danger:hover { background: rgba(230,57,70,0.25); }
        .btn-sm { padding: 7px 14px; font-size: 12px; }

        .vote-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }
        .vote-option-btn {
            padding: 28px 20px;
            background: rgba(76,201,240,0.08);
            border: 2px solid rgba(76,201,240,0.2);
            border-radius: var(--radius);
            color: var(--cyan);
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .vote-option-btn:hover {
            background: rgba(76,201,240,0.18);
            border-color: var(--cyan);
            transform: translateY(-3px);
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .alert-error   { background: rgba(230,57,70,0.12); border: 1px solid rgba(230,57,70,0.3); color: #ff8080; }
        .alert-success { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.3); color: #5dde8a; }
        .alert-info    { background: rgba(76,201,240,0.1); border: 1px solid rgba(76,201,240,0.25); color: var(--cyan); }

        .badge-status-active   { color: #2ecc71; font-weight: 600; }
        .badge-status-revoked  { color: var(--accent); font-weight: 600; }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; }
            body { flex-direction: column; overflow: auto; }
            .main-content { padding: 24px 16px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <h1>🛡️ AE<span>GIS</span></h1>
        <p>Système de Vote Sécurisé</p>
    </div>

    <div class="user-card" id="user-card" style="display:none">
        <div class="name" id="nav-fullname">—</div>
        <div class="username" id="nav-username"></div>
        <span class="role-pill" id="nav-role-pill"></span>
    </div>

    <nav>
        <ul id="nav-menu">
            <!-- Injecté par JS selon le rôle -->
        </ul>
    </nav>

    <div class="sidebar-footer" id="nav-footer" style="display:none">
        <button class="btn-logout" onclick="doLogout()">
            <span>🚪</span> Déconnexion
        </button>
    </div>
</aside>

<div class="main-content">
    <div id="app-content">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
// ── State global ───────────────────────────────────────────────────────────
window.AEGIS = { user: null };

// ── API helper ─────────────────────────────────────────────────────────────
async function api(method, path, body) {
    const opts = {
        method,
        credentials: 'same-origin',
        headers: body ? { 'Content-Type': 'application/json' } : {},
    };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch('/api/' + path, opts);
    const data = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, data };
}

// ── Navigation ─────────────────────────────────────────────────────────────
function buildNav(role) {
    const menu = document.getElementById('nav-menu');
    const p    = location.pathname;

    const NAV = {
        superadmin: [
            { section: 'Principal', items: [
                { href: '/vote',        icon: '🗳️', label: 'Voter' },
                { href: '/compte',      icon: '👤', label: 'Mon compte' },
            ]},
            { section: 'Gestion', items: [
                { href: '/super_admin', icon: '👑', label: 'Administration' },
                { href: '/stats',       icon: '📈', label: 'Résultats & Logs' },
            ]},
        ],
        admin: [
            { section: 'Principal', items: [
                { href: '/vote',   icon: '🗳️', label: 'Voter' },
                { href: '/compte', icon: '👤', label: 'Mon compte' },
            ]},
            { section: 'Gestion', items: [
                { href: '/admin',  icon: '⚙️', label: 'Administration' },
                { href: '/stats',  icon: '📈', label: 'Résultats & Logs' },
            ]},
        ],
        manager: [
            { section: 'Principal', items: [
                { href: '/vote',   icon: '🗳️', label: 'Voter' },
                { href: '/compte', icon: '👤', label: 'Mon compte' },
            ]},
            { section: 'Gestion', items: [
                { href: '/admin',  icon: '⚙️', label: 'Gestion votes' },
            ]},
        ],
        auditor: [
            { section: 'Principal', items: [
                { href: '/vote',   icon: '🗳️', label: 'Voter' },
                { href: '/compte', icon: '👤', label: 'Mon compte' },
                { href: '/stats',  icon: '📈', label: 'Résultats & Audit' },
            ]},
        ],
        member: [
            { section: 'Principal', items: [
                { href: '/vote',   icon: '🗳️', label: 'Voter' },
                { href: '/compte', icon: '👤', label: 'Mon compte' },
            ]},
        ],
    };

    const groups = NAV[role] || NAV.member;
    menu.innerHTML = groups.map(g => `
        <li><span class="nav-section">${g.section}</span></li>
        ${g.items.map(item => `
            <li><a href="${item.href}" class="nav-link ${p === item.href ? 'active' : ''}">
                <span class="nav-icon">${item.icon}</span> ${item.label}
            </a></li>
        `).join('')}
    `).join('');
}

function showUserCard(user) {
    document.getElementById('user-card').style.display = '';
    document.getElementById('nav-footer').style.display = '';
    document.getElementById('nav-fullname').textContent = `${user.first_name} ${user.last_name}`;
    document.getElementById('nav-username').textContent = '@' + user.username;
    const pill = document.getElementById('nav-role-pill');
    pill.textContent = user.role;
    pill.className = 'role-pill role-' + user.role;
    buildNav(user.role);
}

async function doLogout() {
    await api('POST', 'logout');
    window.location.href = '/connexion';
}

// ── Init ────────────────────────────────────────────────────────────────────
(async () => {
    const currentPath = location.pathname;
    const publicPaths = ['/', '/connexion'];

    const { ok, data } = await api('GET', 'me');
    if (ok) {
        window.AEGIS.user = data;
        showUserCard(data);
        // Rediriger la page de connexion si déjà connecté
        if (publicPaths.includes(currentPath)) {
            redirectByRole(data.role);
        }
    } else {
        // Non connecté : rediriger vers connexion sauf si déjà dessus
        if (!publicPaths.includes(currentPath)) {
            window.location.href = '/connexion';
        }
    }
})();

function redirectByRole(role) {
    const map = {
        superadmin: '/super_admin', super_admin: '/super_admin',
        admin:      '/admin',
        manager:    '/admin',
        auditor:    '/stats',
        member:     '/vote',
    };
    window.location.href = map[role] || '/vote';
}
</script>

{% block scripts %}{% endblock %}

<!-- ══════════════ CLAVIER VIRTUEL ══════════════ -->
<div id="vkb" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:10000;
    background:var(--deep);border-top:2px solid var(--border);
    padding:10px 10px 18px;user-select:none;
    box-shadow:0 -8px 40px rgba(0,0,0,.5);
    transition:transform .18s ease;">
  <div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
    <button id="vkb-close" type="button" style="background:none;border:none;color:var(--muted);
        font-size:20px;cursor:pointer;padding:0 4px;line-height:1;">✕</button>
  </div>
  <div id="vkb-rows" style="display:flex;flex-direction:column;gap:5px;max-width:720px;margin:0 auto;"></div>
</div>

<script>
(function(){
  'use strict';
  let _tgt = null, _shifted = false, _caps = false;

  const ALPHA = [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['a','z','e','r','t','y','u','i','o','p'],
    ['q','s','d','f','g','h','j','k','l','m'],
    ['w','x','c','v','b','n'],
  ];
  const SHIFT_ROW0 = ['&','é','"',"'",'(','-','è','_','ç','à'];

  /* ── Key button factory ── */
  function makeBtn(label, action, extraStyle){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText =
      'flex:1;min-width:28px;padding:11px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.1);' +
      'background:rgba(255,255,255,.07);color:var(--text);font-family:"DM Sans",sans-serif;' +
      'font-size:15px;cursor:pointer;transition:background .1s;' + (extraStyle||'');
    b.addEventListener('pointerdown', e => { e.preventDefault(); action(); });
    b.addEventListener('pointerenter', () => { b.style.background='rgba(255,255,255,.16)'; });
    b.addEventListener('pointerleave', () => { b.style.background=''; });
    return b;
  }

  /* ── Insert / delete ── */
  function ins(ch){
    if(!_tgt) return;
    const s=_tgt.selectionStart, e=_tgt.selectionEnd, v=_tgt.value;
    _tgt.value = v.slice(0,s)+ch+v.slice(e);
    _tgt.selectionStart = _tgt.selectionEnd = s+ch.length;
    _tgt.dispatchEvent(new Event('input',{bubbles:true}));
    if(_shifted && !_caps){ _shifted=false; render(); }
  }
  function bksp(){
    if(!_tgt) return;
    const s=_tgt.selectionStart, e=_tgt.selectionEnd;
    if(s!==e){ ins(''); return; }
    if(s>0){
      _tgt.value = _tgt.value.slice(0,s-1)+_tgt.value.slice(s);
      _tgt.selectionStart = _tgt.selectionEnd = s-1;
      _tgt.dispatchEvent(new Event('input',{bubbles:true}));
    }
  }
  function enter(){
    if(_tgt) _tgt.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
    hide();
  }

  /* ── Render ── */
  function render(){
    const c = document.getElementById('vkb-rows');
    c.innerHTML = '';
    const isNum = _tgt && (_tgt.inputMode==='numeric' || _tgt.type==='number');

    if(isNum){
      [['7','8','9'],['4','5','6'],['1','2','3'],['','0','⌫']].forEach(row=>{
        const r=document.createElement('div');
        r.style='display:flex;gap:6px;';
        row.forEach(k=>{
          if(k===''){
            const sp=document.createElement('div'); sp.style='flex:1'; r.appendChild(sp);
          } else if(k==='⌫'){
            r.appendChild(makeBtn('⌫',bksp,'background:rgba(230,57,70,.18);color:#ff8090;flex:1;'));
          } else {
            r.appendChild(makeBtn(k,()=>ins(k),'font-size:20px;'));
          }
        });
        c.appendChild(r);
      });
      return;
    }

    /* Alpha rows */
    const useShift = _shifted || _caps;
    ALPHA.forEach((row, ri)=>{
      const r=document.createElement('div'); r.style='display:flex;gap:4px;';
      row.forEach((k,ki)=>{
        const ch = useShift ? (ri===0 ? SHIFT_ROW0[ki] : k.toUpperCase()) : k;
        r.appendChild(makeBtn(ch, ()=>ins(ch)));
      });
      c.appendChild(r);
    });

    /* Bottom row */
    const bot=document.createElement('div'); bot.style='display:flex;gap:4px;margin-top:2px;';

    /* Shift */
    const shLabel = _caps ? '⇪' : (_shifted ? '⇧' : '⇧');
    const shStyle = (_shifted||_caps)
      ? 'flex:0 0 58px;background:rgba(76,201,240,.25);color:var(--cyan);font-size:16px;'
      : 'flex:0 0 58px;font-size:16px;';
    bot.appendChild(makeBtn(shLabel, ()=>{
      if(_caps){_caps=false;_shifted=false;}
      else if(_shifted){_caps=true;}
      else{_shifted=true;}
      render();
    }, shStyle));

    /* Space */
    bot.appendChild(makeBtn('espace', ()=>ins(' '), 'flex:3;color:var(--muted);font-size:12px;'));

    /* Special chars */
    ['@','.','-','_'].forEach(k=>{
      bot.appendChild(makeBtn(k, ()=>ins(k), 'flex:0 0 36px;color:var(--cyan);'));
    });

    /* Backspace */
    bot.appendChild(makeBtn('⌫', bksp, 'flex:0 0 52px;background:rgba(230,57,70,.15);color:#ff8090;'));

    /* Enter */
    bot.appendChild(makeBtn('↵', enter, 'flex:0 0 52px;background:rgba(76,201,240,.18);color:var(--cyan);font-size:18px;'));

    c.appendChild(bot);
  }

  /* ── Show / hide ── */
  function show(el){
    _tgt = el; _shifted = false;
    render();
    const kb = document.getElementById('vkb');
    kb.style.display = '';
    /* push main content up so input stays visible */
    document.querySelector('.main-content') && (
      document.querySelector('.main-content').style.paddingBottom = '320px'
    );
    setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}), 150);
  }
  function hide(){
    document.getElementById('vkb').style.display = 'none';
    const mc = document.querySelector('.main-content');
    if(mc) mc.style.paddingBottom = '';
    _tgt = null;
  }

  /* ── Attach to inputs ── */
  function attach(el){
    if(el._vkb) return;
    el._vkb = true;
    el.addEventListener('focus', ()=>show(el));
  }
  function scan(){
    document.querySelectorAll(
      'input:not([type=date]):not([type=color]):not([type=file])' +
      ':not([type=range]):not([type=checkbox]):not([type=radio]):not([type=submit]),' +
      'textarea'
    ).forEach(attach);
  }

  /* ── Close on outside click ── */
  document.addEventListener('pointerdown', e=>{
    const kb = document.getElementById('vkb');
    if(!kb.contains(e.target) &&
       !e.target.matches('input,textarea') &&
       kb.style.display !== 'none'){
      hide();
    }
  });

  document.addEventListener('keydown', e=>{ if(e.key==='Escape') hide(); });
  document.getElementById('vkb-close').addEventListener('pointerdown', e=>{
    e.preventDefault(); hide();
  });

  /* Scan on load + observe dynamic content (modals etc.) */
  document.addEventListener('DOMContentLoaded', scan);
  new MutationObserver(scan).observe(document.body, {childList:true, subtree:true});
})();
</script>
</body>
</html>
