<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AEGIS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:   #0d1b2a;
            --deep:   #1b2d42;
            --accent: #e63946;
            --gold:   #f4a261;
            --cyan:   #4cc9f0;
            --text:   #e8edf3;
            --muted:  #7a8ca0;
            --surface:#162032;
            --border: rgba(255,255,255,0.08);
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--deep);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-logo {
            padding: 32px 28px 24px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            color: white;
        }
        .sidebar-logo h1 span { color: var(--accent); }
        .sidebar-logo p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .user-card {
            margin: 20px 16px;
            padding: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .user-card .name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 15px;
        }
        .user-card .username {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }
        .role-pill {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .role-superadmin, .role-super_admin { background: var(--accent); color: white; }
        .role-admin      { background: var(--gold); color: #1a0000; }
        .role-manager, .role-responsable   { background: #2ecc71; color: #001a08; }
        .role-user, .role-member  { background: var(--cyan); color: #001a2a; }
        .role-auditor    { background: #9b59b6; color: white; }

        nav ul { list-style: none; padding: 12px 0; flex: 1; }
        .nav-section {
            padding: 16px 24px 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 24px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.15s;
        }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.05); border-left-color: var(--accent); }
        .nav-link.active { color: white; background: rgba(230,57,70,0.12); border-left-color: var(--accent); }
        .nav-icon { font-size: 16px; width: 20px; text-align: center; }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }
        .btn-logout {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            background: rgba(230,57,70,0.1);
            border: 1px solid rgba(230,57,70,0.25);
            border-radius: var(--radius);
            color: var(--accent);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .btn-logout:hover { background: rgba(230,57,70,0.2); }

        /* ── Main ── */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 48px;
            background: var(--navy);
        }

        /* ── Components ── */
        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .page-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 36px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
        }
        .card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .stat-card.accent::before { background: var(--accent); }
        .stat-card.cyan::before   { background: var(--cyan); }
        .stat-card.gold::before   { background: var(--gold); }
        .stat-number {
            font-family: 'Syne', sans-serif;
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
        }
        .stat-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        tr:hover td { background: rgba(255,255,255,0.03); }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: border-color 0.15s;
            margin-bottom: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--cyan);
        }
        select option { background: var(--deep); }
        label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #c1121f; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
        .btn-secondary:hover { background: rgba(255,255,255,0.14); }
        .btn-danger { background: rgba(230,57,70,0.15); color: var(--accent); border: 1px solid rgba(230,57,70,0.3); }
        .btn-danger:hover { background: rgba(230,57,70,0.25); }
        .btn-sm { padding: 7px 14px; font-size: 12px; }

        .vote-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }
        .vote-option-btn {
            padding: 28px 20px;
            background: rgba(76,201,240,0.08);
            border: 2px solid rgba(76,201,240,0.2);
            border-radius: var(--radius);
            color: var(--cyan);
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .vote-option-btn:hover {
            background: rgba(76,201,240,0.18);
            border-color: var(--cyan);
            transform: translateY(-3px);
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .alert-error   { background: rgba(230,57,70,0.12); border: 1px solid rgba(230,57,70,0.3); color: #ff8080; }
        .alert-success { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.3); color: #5dde8a; }
        .alert-info    { background: rgba(76,201,240,0.1); border: 1px solid rgba(76,201,240,0.25); color: var(--cyan); }

        .badge-status-active   { color: #2ecc71; font-weight: 600; }
        .badge-status-revoked  { color: var(--accent); font-weight: 600; }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; }
            body { flex-direction: column; overflow: auto; }
            .main-content { padding: 24px 16px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <h1>🛡️ AE<span>GIS</span></h1>
        <p>Système de Vote Sécurisé</p>
    </div>

    <div class="user-card" id="user-card" style="display:none">
        <div class="name" id="nav-fullname">—</div>
        <div class="username" id="nav-username"></div>
        <span class="role-pill" id="nav-role-pill"></span>
    </div>

    <nav>
        <ul id="nav-menu">
            <!-- Injecté par JS selon le rôle -->
        </ul>
    </nav>

    <div class="sidebar-footer" id="nav-footer" style="display:none">
        <button class="btn-logout" onclick="doLogout()">
            <span>🚪</span> Déconnexion
        </button>
    </div>
</aside>

<div class="main-content">
    <div id="app-content">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
// ── State global ───────────────────────────────────────────────────────────
window.AEGIS = { user: null };

// ── API helper ─────────────────────────────────────────────────────────────
async function api(method, path, body) {
    const opts = {
        method,
        credentials: 'same-origin',
        headers: body ? { 'Content-Type': 'application/json' } : {},
    };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch('/api/' + path, opts);
    const data = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, data };
}

// ── Navigation ─────────────────────────────────────────────────────────────
function buildNav(role) {
    const menu = document.getElementById('nav-menu');
    const p    = location.pathname;

    const NAV = {
        superadmin: [
            { section: 'Principal', items: [
                { href: '/vote',        icon: '🗳️', label: 'Voter' },
                { href: '/compte',      icon: '👤', label: 'Mon compte' },
            ]},
            { section: 'Gestion', items: [
                { href: '/super_admin', icon: '👑', label: 'Administration' },
                { href: '/stats',       icon: '📈', label: 'Résultats & Logs' },
            ]},
        ],
        admin: [
            { section: 'Principal', items: [
                { href: '/vote',   icon: '🗳️', label: 'Voter' },
                { href: '/compte', icon: '👤', label: 'Mon compte' },
            ]},
            { section: 'Gestion', items: [
                { href: '/admin',  icon: '⚙️', label: 'Administration' },
                { href: '/stats',  icon: '📈', label: 'Résultats & Logs' },
            ]},
        ],
        manager: [
            { section: 'Principal', items: [
                { href: '/vote',   icon: '🗳️', label: 'Voter' },
                { href: '/compte', icon: '👤', label: 'Mon compte' },
            ]},
            { section: 'Gestion', items: [
                { href: '/admin',  icon: '⚙️', label: 'Gestion votes' },
            ]},
        ],
        auditor: [
            { section: 'Principal', items: [
                { href: '/vote',   icon: '🗳️', label: 'Voter' },
                { href: '/compte', icon: '👤', label: 'Mon compte' },
                { href: '/stats',  icon: '📈', label: 'Résultats & Audit' },
            ]},
        ],
        member: [
            { section: 'Principal', items: [
                { href: '/vote',   icon: '🗳️', label: 'Voter' },
                { href: '/compte', icon: '👤', label: 'Mon compte' },
            ]},
        ],
    };

    const groups = NAV[role] || NAV.member;
    menu.innerHTML = groups.map(g => `
        <li><span class="nav-section">${g.section}</span></li>
        ${g.items.map(item => `
            <li><a href="${item.href}" class="nav-link ${p === item.href ? 'active' : ''}">
                <span class="nav-icon">${item.icon}</span> ${item.label}
            </a></li>
        `).join('')}
    `).join('');
}

function showUserCard(user) {
    document.getElementById('user-card').style.display = '';
    document.getElementById('nav-footer').style.display = '';
    document.getElementById('nav-fullname').textContent = `${user.first_name} ${user.last_name}`;
    document.getElementById('nav-username').textContent = '@' + user.username;
    const pill = document.getElementById('nav-role-pill');
    pill.textContent = user.role;
    pill.className = 'role-pill role-' + user.role;
    buildNav(user.role);
}

async function doLogout() {
    await api('POST', 'logout');
    window.location.href = '/connexion';
}

// ── Init ────────────────────────────────────────────────────────────────────
(async () => {
    const currentPath = location.pathname;
    const publicPaths = ['/', '/connexion'];

    const { ok, data } = await api('GET', 'me');
    if (ok) {
        window.AEGIS.user = data;
        showUserCard(data);
        // Rediriger la page de connexion si déjà connecté
        if (publicPaths.includes(currentPath)) {
            redirectByRole(data.role);
        }
    } else {
        // Non connecté : rediriger vers connexion sauf si déjà dessus
        if (!publicPaths.includes(currentPath)) {
            window.location.href = '/connexion';
        }
    }
})();

function redirectByRole(role) {
    const map = {
        superadmin: '/super_admin', super_admin: '/super_admin',
        admin:      '/admin',
        manager:    '/admin',
        auditor:    '/stats',
        member:     '/vote',
    };
    window.location.href = map[role] || '/vote';
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
